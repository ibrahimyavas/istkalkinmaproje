# Statik harita varlıkları: stil, fontlar (glyph), sprite ve PMTiles dosyası. CORS herkese açık.
#   http://localhost:8080/harita-stili.json
#   http://localhost:8080/fonts/{fontstack}/{range}.pbf
#   http://localhost:8080/sprites/light(.json|.png|@2x.json|@2x.png)
#   http://localhost:8080/istanbul.pmtiles   (Range istekleriyle; pmtiles:// protokolü için)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        text/html                  html;
        application/json           json;
        application/x-protobuf     pbf;
        image/png                  png;
        application/vnd.pmtiles    pmtiles;
    }
    default_type application/octet-stream;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    location = /harita-stili.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
