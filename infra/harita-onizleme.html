<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harita önizleme</title>
  <!-- Yalnızca geliştirme önizlemesi: http://localhost:8080/onizleme.html -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body, #harita { margin: 0; height: 100%; background: #F7F4EE; }
    #bilgi { position: absolute; top: 8px; left: 8px; z-index: 1; background: #fffc; padding: 4px 8px;
             font: 12px system-ui, sans-serif; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="bilgi">yükleniyor…</div>
  <div id="harita"></div>
  <script>
    const p = new URLSearchParams(location.hash.slice(1));
    const harita = new maplibregl.Map({
      container: 'harita',
      style: '/harita-stili.json',
      center: [Number(p.get('lon') || 28.975), Number(p.get('lat') || 41.03)],
      zoom: Number(p.get('z') || 13),
    });
    const bilgi = document.getElementById('bilgi');
    const yaz = () => { const c = harita.getCenter(); bilgi.textContent = `z${harita.getZoom().toFixed(1)}  ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`; };
    harita.on('moveend', yaz);
    harita.on('idle', () => { yaz(); window.haritaHazir = true; });
    harita.on('error', (e) => { (window.haritaHatalari ||= []).push(String(e.error?.message || e.error)); });
  </script>
</body>
</html>
